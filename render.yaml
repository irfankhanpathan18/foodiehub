services:
  # FoodieHub Backend Express API Web Service
  - type: web
    name: foodiehub-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: foodiehub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set this to your deployed Vercel frontend URL, e.g. https://foodiehub.vercel.app

databases:
  # FoodieHub Managed PostgreSQL Database
  - name: foodiehub-db
    databaseName: foodiehub
    user: foodiehub_user
    plan: free
    region: oregon
